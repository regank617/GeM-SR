# =============================================================================
# LiDSSM V5 Configuration
# =============================================================================
# Ablation toggles:
#   training.loss — CE weighting for hierarchical V5 loss (void / background class).
#   training.pretraining — conditioner phase-1 L1 (sparsity / edge vs active).
#   model.generator_v5.params — same keys override training.* when set here; plus
#     joint-tokenizer flags (apply_sparsity_mask_to_latents, use_null_token_routing, use_null_routing).

globals:
  seed: 42
  resolution: 48
  per_gpu_batch_size: 64
  learning_rate: 5.0e-4
  # Benchmark CNN / diffusion scripts read these so they stay at 1e-4 while GeM-SR uses learning_rate (5e-4).
  cnn_learning_rate: 1.0e-4
  diffusion_learning_rate: 1.0e-4
  output_dir: "/ssm_runs"
  data_path: './data'

experiment:
  project: "GeM-SR"
  name: "GeM-SR_Modeling"
  run_name: "gemsr_gen_null_ablation"
  logger: "wandb"
  # When True, restores latest checkpoint-* under this run's logs/ (weights + optimizer + step). Set False for a true restart with the same run id.
  resume: True
  debug: False
  intervals:
    save_every: 2500
    eval_every: 1000
    log_steps: 100
  notes: 'V3 Refactor: Clean residual token prediction'
finetuning:
  active: False
  refiner_finetune: False
  finetuning_steps: 25000
  checkpoint: 97500
  layers:
    - "out_conv"
    - "proj_ll_out"
    - "fusion_decoders"
  lambda_l1: 1.0
  lambda_mse: 0.0
  lambda_ssim: 0.5
model:
  tokenizer:
    # Weights + tokenizer YAML must match generator_v5.params.tokenizer_layout:
    #   separate -> LidarTokenizerV6 (fsq_details_list); joint -> tokenizerV5_old (single fsq_details).
    # trainV5 builds the tokenizer from pretrained YAML + overrides below; no Hydra target is used here.
    params:
      input_channels: 1
    pretrained:
      path_to_config: './path/to/tokenizer/config.yaml'
      path_to_ckpt: './path/to/tokenizer/model.safetensors'
      #path_to_config: './path/to/tokenizer/config.yaml'
      #path_to_ckpt: './path/to/tokenizer/checkpoint/model.safetensors'
  generator_v5:
    target: "src.modeling.generator.generator_merged.HierarchicalGenerator"
    params:
      tokenizer_dim: 1
      embed_dim: 384
      rq_depths: 1
      cond_dropout_prob: 0.1
      root_depth: 2
      s0_depth: 2
      s1_depth: 4
      s2_depth: 6
      heads: 6
      mlp_ratio: 2

      tokenizer_layout: joint
      fast: True
      backbone: convnext
      paper_ablation: False
      # Paper generator only (hierarchial_generator_paper). Default false = original, loads old ckpts.
      # conv_bias: true
      # linear_bias: true   # FastScaleGenerator.in_proj + global_proj first Linear
      # Conditioner + pretrainer projection Convs (spatial2d/ssm/conditioner.py)
      # conditioner_conv_bias: true
      cfg_training: False
      cfg_scale: 1.0

      temperature: 1.0
      top_k: 100

      # --- Joint tokenizer ablations (merged over pretrained tokenizer YAML) ---
      # tokenizer_conv_bias: false
      # tokenizer_standard_blocks: false  # true = CNN baseline (GN + standard res); train new tokenizer ckpt
      apply_sparsity_mask_to_latents: false
      use_null_token_routing: true
      # use_null_routing: true  # optional override; if omitted, see training.pretraining.use_null_routing

      # --- Optional overrides (same keys as training.loss / training.pretraining) ---
      use_ce_weighting: true
      ce_void_class_weight: 0.5
      use_sparsity_weighted_pretrain_l1: false
      pretrain_edge_weight_multiplier: 10.0
      pretrain_active_threshold: 0.05

optimizer:
  name: "adamw"
  params:
    lr: ${globals.learning_rate}
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1e-8
  scheduler:
    name: "cosine_with_minimum"
    warmup_steps: 5000

dataset:
  infra:
    root_dir:
      - './data'
    num_workers_per_gpu: 8
    pin_memory: True
    persistent_workers: True
  loader:
    per_gpu_batch_size: ${globals.per_gpu_batch_size}
    resolution: ${globals.resolution}

training:
  end_to_end: false
  cond_lr_scale: 0.1
  loss:
    # Hierarchical V5 CE: down-weight void / background class when use_ce_weighting is true.
    use_ce_weighting: true
    ce_void_class_weight: 0.5
    # Optional per-scale weights (weighted mean). Omitted keys default to 1.0.
    # v5_scale_weights:
    #   scale_1: 1.25
    #   scale_2: 1.5
  pretraining:
    cond_steps: 20000
    pretrained_cond_path: ''
    # Conditioner wavelet pretrain L1: weight void/active voxels; edge_weight on low-density (active_threshold).
    use_null_routing: true
    # null / omit -> follow use_null_routing; set true/false to force regardless of use_null_routing.
    use_sparsity_weighted_pretrain_l1: null
    pretrain_edge_weight_multiplier: 10.0
    pretrain_active_threshold: 0.05
  compute:
    mixed_precision: "bf16"
    enable_tf32: True
    grad_accum_steps: 1
    max_grad_norm: 1.0
  duration:
    max_steps: 300_000
    num_epochs: 400
