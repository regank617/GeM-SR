# =============================================================================
# LiDAR tokenizer ablation — No LL residual in detail fusion (LH/HL/HH only)
# Train: training/tokenizer/trainV5.py with this config.
# =============================================================================
# Detail path: latent_dim=3; fusion input is raw HF bands only; IDWT uses
# current LL recon + decoder HF output (no LL delta from detail decoder).

globals:
  seed: 42
  resolution: 48
  per_gpu_batch_size: 64
  learning_rate: 1e-4
  output_dir: "/gemsr_tokenizer_runs"

experiment:
  project: "GeM-SR"
  name: "GeM-SR_Modeling"
  run_name: "gemsr_tokenizer_vq_no_ll"
  logger: "wandb"
  resume: true
  debug: false
  intervals:
    save_every: 1_000
    eval_every: 500
    log_steps: 100
  checkpoints:
    init: ""
  notes: "VQ ablation: no LL error channel in detail fusion (LidarTokenizerNoLL)."

model:
  tokenizer:
    target: "src.modeling.tokenizer.tokenizer_no_ll.LidarTokenizerNoLL"
    params:
      input_channels: 1
      hidden_dim: 64
      num_scales: 3
      latent_dim: 3
      inter_loss_weight: 2.0
      use_refiner: true
      codebook_size_root: 175
      codebook_size_detail: 2401
      commitment_cost: 0.25
      vq_loss_weight: 0.25
      vq_use_tanh_bound: true
      apply_sparsity_mask_to_latents: true
      tokenizer_conv_bias: false
      tokenizer_standard_blocks: false

optimizer:
  name: "adamw"
  params:
    lr: ${globals.learning_rate}
    weight_decay: 1e-4
    betas: [0.9, 0.999]
    eps: 1e-8
  scheduler:
    name: "cosine_with_minimum"
    warmup_steps: 5000

dataset:
  infra:
    root_dir: "./data"
    num_workers_per_gpu: 8
    pin_memory: true
    persistent_workers: true
  loader:
    per_gpu_batch_size: ${globals.per_gpu_batch_size}
    resolution: ${globals.resolution}
    normalize_diffusion: false
    preload_to_ram: false

training:
  compute:
    mixed_precision: "bf16"
    enable_tf32: true
    grad_accum_steps: 1
    max_grad_norm: 1.0
  duration:
    max_steps: 300_000
    num_epochs: 400
  ema:
    enabled: true
    decay: 0.999
